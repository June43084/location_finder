<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>吃喝玩樂搜尋器</title>
  <link rel="stylesheet" href="/static/style.css" />
  <link rel="icon" href="/static/favicon.ico" type="image/x-icon" />
</head>
<body>
  <div class="container">
    <h1>吃喝玩樂搜尋器</h1>

    <div id="message" class="message"></div>

    <section id="locationSection">
      <h2>我的位置</h2>
      <p id="currentLocationDisplay">正在獲取您的位置...</p>
      <button id="getLocationBtn" class="btn">重新獲取我的位置</button>

      <div id="manualLocationInput" class="hidden-section">
        <p>或輸入您的地址：</p>
        <input
          type="text"
          id="addressInput"
          placeholder="例如：台北市信義區市府路1號"
        />
        <button id="geocodeAddressBtn" class="btn">轉換地址</button>
      </div>
    </section>

    <section id="placeTypeSelection" class="hidden-section">
      <h2>搜尋附近地點</h2>
      <p>請選擇您想搜尋的「吃喝玩樂」類型：</p>

      <select id="searchType">
        <optgroup label="🍽️ 吃喝">
          <option value="restaurant">餐廳</option>
          <option value="cafe">咖啡廳</option>
          <option value="bar">酒吧</option>
          <option value="bakery">麵包店</option>
          <option value="meal_delivery">餐點外送</option>
          <option value="meal_takeaway">餐點外帶</option>
        </optgroup>

        <optgroup label="🎡 玩樂">
          <option value="amusement_park">遊樂園</option>
          <option value="park">公園</option>
          <option value="museum">博物館</option>
          <option value="movie_theater">電影院</option>
          <option value="bowling_alley">保齡球館</option>
          <option value="shopping_mall">購物中心</option>
          <option value="spa">SPA</option>
          <option value="beauty_salon">美容院</option>
          <option value="gym">健身房</option>
          <option value="zoo">動物園</option>
          <option value="tourist_attraction">觀光景點</option>
          <option value="night_club">KTV/夜店</option>
        </optgroup>
      </select>

      <div class="range-container">
        <label for="searchRadius">搜尋範圍:</label>
        <input
          type="range"
          id="searchRadius"
          min="100"
          max="10000"
          value="5000"
          step="100"
        />
        <span id="radiusValue">5000</span> 公尺
      </div>

      <button id="searchNearbyBtn" class="btn">開始搜尋</button>
    </section>

    <section id="resultsContainer">
      <h2>搜尋結果（下方有轉盤抽選功能）</h2>
      <h4>若該店無圖片，本頁將以風景照替代</h4>

      <div id="placesActions" class="hidden-section">
        <button id="selectAllBtn" class="btn-small">全選</button>
        <button id="deselectAllBtn" class="btn-small">全不選</button>
        <button id="updateWheelBtn" class="btn-small">
          🎯 根據勾選更新轉盤
        </button>
      </div>

      <div id="placesList"></div>
    </section>

    <section id="wheelSection" style="display:none;">
      <h2>🎡 轉盤抽選</h2>

      <div class="wheel-wrapper">
        <div class="pointer"></div>
        <canvas id="wheelCanvas" width="400" height="400"></canvas>
      </div>

      <button id="spinBtn" class="btn">轉動！</button>
      <p id="result">請按下「轉動！」開始遊戲</p>
    </section>
  </div>

  <script src="/static/script.js"></script>

  <script>
    window.setupWheelWithPlaces = function (placeNames) {
      const canvas = document.getElementById('wheelCanvas');
      const spinBtn = document.getElementById('spinBtn');
      const result = document.getElementById('result');
      const wheelSection = document.getElementById('wheelSection');

      if (!canvas || !spinBtn || !result || !wheelSection) {
        return;
      }

      const prizes = Array.isArray(placeNames)
        ? placeNames.filter(Boolean)
        : [];

      if (prizes.length === 0) {
        wheelSection.style.display = 'none';
        result.textContent = '請先勾選至少一個地點';
        return;
      }

      wheelSection.style.display = 'block';

      const ctx = canvas.getContext('2d');
      const totalSegments = prizes.length;
      const baseColors = [
        '#f94144',
        '#f3722c',
        '#f8961e',
        '#43aa8b',
        '#577590',
        '#277da1'
      ];
      const colors = Array.from(
        { length: totalSegments },
        (_, i) => baseColors[i % baseColors.length]
      );
      const anglePerSegment = (2 * Math.PI) / totalSegments;

      let currentAngle = 0;
      let spinning = false;

      function drawWheel(rotation = 0) {
        ctx.clearRect(0, 0, 400, 400);

        ctx.save();
        ctx.translate(200, 200);
        ctx.rotate(rotation);
        ctx.translate(-200, -200);

        for (let i = 0; i < totalSegments; i++) {
          const startAngle = i * anglePerSegment;
          const endAngle = startAngle + anglePerSegment;

          ctx.beginPath();
          ctx.moveTo(200, 200);
          ctx.arc(200, 200, 180, startAngle, endAngle);
          ctx.fillStyle = colors[i];
          ctx.fill();
          ctx.stroke();

          ctx.save();
          ctx.translate(200, 200);
          ctx.rotate(startAngle + anglePerSegment / 2);
          ctx.textAlign = 'right';
          ctx.fillStyle = 'white';
          ctx.font = '14px Arial';
          ctx.fillText(prizes[i].slice(0, 10), 160, 10);
          ctx.restore();
        }

        ctx.restore();
      }

      function showResult(placeName) {
        const placeUrl = window.placeUrlMap?.[placeName];

        result.textContent = '🎉 抽到的是：';

        if (placeUrl) {
          const link = document.createElement('a');
          link.href = placeUrl;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.textContent = placeName;

          result.appendChild(link);
          result.append('！');
        } else {
          result.append(`${placeName}！`);
        }
      }

      function spinWheel() {
        if (spinning || prizes.length === 0) {
          return;
        }

        spinning = true;
        result.textContent = '轉動中...';
        spinBtn.disabled = true;

        const startAngle = currentAngle;
        const spinAmount =
          (5 + Math.random() * 3) * 2 * Math.PI;
        const finalAngle = startAngle + spinAmount;
        const duration = 5000;
        const startTime = performance.now();

        function animate(time) {
          const elapsed = time - startTime;
          const progress = Math.min(elapsed / duration, 1);
          const ease = 1 - Math.pow(1 - progress, 3);

          currentAngle =
            startAngle + (finalAngle - startAngle) * ease;

          drawWheel(currentAngle);

          if (progress < 1) {
            requestAnimationFrame(animate);
            return;
          }

          const normalized =
            currentAngle % (2 * Math.PI);

          const pointerAngle =
            (
              3 * Math.PI / 2 -
              normalized +
              2 * Math.PI
            ) % (2 * Math.PI);

          const index =
            Math.floor(pointerAngle / anglePerSegment) %
            totalSegments;

          showResult(prizes[index]);

          spinning = false;
          spinBtn.disabled = false;
        }

        requestAnimationFrame(animate);
      }

      spinBtn.onclick = spinWheel;
      result.textContent = '請按下「轉動！」開始遊戲';
      drawWheel();
    };
  </script>
</body>
</html>
