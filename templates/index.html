<!DOCTYPE html>

<html lang="zh-TW">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    吃喝玩樂搜尋器
  </title>

  <link
    rel="stylesheet"
    href="/static/style.css"
  >

</head>


<body>


<main class="container">


  <h1>
    吃喝玩樂搜尋器
  </h1>


  <div
    id="message"
    class="message"
    aria-live="polite"
  ></div>


  <section>


    <h2>
      我的位置
    </h2>


    <p id="currentLocationDisplay">
      正在獲取您的位置...
    </p>


    <button
      id="getLocationBtn"
      class="btn"
      type="button"
    >
      重新獲取我的位置
    </button>


    <div
      id="manualLocationInput"
      class="hidden-section"
    >


      <p>
        或輸入您的地址：
      </p>


      <input
        id="addressInput"
        type="text"
        placeholder="例如：台北市信義區市府路1號"
        autocomplete="street-address"
      >


      <button
        id="geocodeAddressBtn"
        class="btn"
        type="button"
      >
        轉換地址
      </button>


    </div>


  </section>


  <section
    id="placeTypeSelection"
    class="hidden-section"
  >


    <h2>
      搜尋附近地點
    </h2>


    <p>
      請選擇您想搜尋的「吃喝玩樂」類型：
    </p>


    <select id="searchType">


      <optgroup label="🍽️ 吃喝">


        <option value="restaurant">
          餐廳
        </option>


        <option value="cafe">
          咖啡廳
        </option>


        <option value="bar">
          酒吧
        </option>


        <option value="bakery">
          麵包店
        </option>


        <option value="meal_delivery">
          餐點外送
        </option>


        <option value="meal_takeaway">
          餐點外帶
        </option>


      </optgroup>


      <optgroup label="🎡 玩樂">


        <option value="amusement_park">
          遊樂園
        </option>


        <option value="park">
          公園
        </option>


        <option value="museum">
          博物館
        </option>


        <option value="movie_theater">
          電影院
        </option>


        <option value="bowling_alley">
          保齡球館
        </option>


        <option value="shopping_mall">
          購物中心
        </option>


        <option value="spa">
          SPA
        </option>


        <option value="beauty_salon">
          美容院
        </option>


        <option value="gym">
          健身房
        </option>


        <option value="zoo">
          動物園
        </option>


        <option value="tourist_attraction">
          觀光景點
        </option>


        <option value="night_club">
          KTV / 夜店
        </option>


      </optgroup>


    </select>


    <label class="open-now-filter">


      <input
        id="openNowOnly"
        type="checkbox"
      >


      <span>
        只看目前營業中
      </span>


    </label>


    <div class="range-container">


      <label for="searchRadius">
        搜尋範圍
      </label>


      <input
        id="searchRadius"
        type="range"
        min="100"
        max="15000"
        value="5000"
        step="100"
      >


      <div class="range-value">


        <span id="radiusValue">
          5000
        </span>


        公尺


      </div>


    </div>


    <button
      id="searchNearbyBtn"
      class="btn btn-primary"
      type="button"
    >
      開始搜尋
    </button>


  </section>


  <section id="resultsContainer">


    <div class="results-heading-row">


      <div>


        <h2>
          搜尋結果
        </h2>


        <p class="result-note">
          **圖片顯示速度會較慢
        </p>


        <p class="result-note">
          無可用店家圖片時會顯示預設鹿圖。
        </p>


      </div>


      <a
        id="jumpToWheelBtn"
        href="#wheelSection"
        class="btn btn-wheel hidden-section"
      >
        🎡 直接前往轉盤
      </a>


    </div>


    <div
      id="placesActions"
      class="places-actions hidden-section"
    >


      <button
        id="selectAllBtn"
        class="btn-small"
        type="button"
      >
        全選
      </button>


      <button
        id="deselectAllBtn"
        class="btn-small"
        type="button"
      >
        全不選
      </button>


      <button
        id="updateWheelBtn"
        class="btn-small"
        type="button"
      >
        🎯 更新並前往轉盤
      </button>


    </div>


    <div
      id="resultsSummary"
      class="results-summary"
    ></div>


    <div
      id="placesList"
      class="places-grid"
    ></div>


    <nav
      id="pagination"
      class="pagination hidden-section"
      aria-label="搜尋結果分頁"
    >


      <button
        id="prevPageBtn"
        class="pagination-btn"
        type="button"
      >
        ← 上一頁
      </button>


      <span
        id="pageInfo"
        class="page-info"
      >
        第 1 / 1 頁
      </span>


      <button
        id="nextPageBtn"
        class="pagination-btn"
        type="button"
      >
        下一頁 →
      </button>


    </nav>


  </section>


  <section
    id="wheelSection"
    class="wheel-section"
    style="display:none;"
  >


    <h2>
      🎡 轉盤抽選
    </h2>


    <div class="wheel-wrapper">


      <div class="pointer"></div>


      <canvas
        id="wheelCanvas"
        width="400"
        height="400"
      ></canvas>


    </div>


    <button
      id="spinBtn"
      class="btn btn-primary"
      type="button"
    >
      轉動！
    </button>


    <p
      id="result"
      class="wheel-result"
    >
      請按下「轉動！」開始遊戲
    </p>


    <a
      href="#resultsContainer"
      class="btn back-to-results"
    >
      ↑ 回到搜尋結果
    </a>


  </section>


</main>


<script src="/static/script.js"></script>


<script>

window.setupWheelWithPlaces = function (
  names
) {


  const canvas =
    document.getElementById(
      'wheelCanvas'
    );


  const spinBtn =
    document.getElementById(
      'spinBtn'
    );


  const result =
    document.getElementById(
      'result'
    );


  const section =
    document.getElementById(
      'wheelSection'
    );


  const jumpBtn =
    document.getElementById(
      'jumpToWheelBtn'
    );


  if (
    !canvas ||
    !spinBtn ||
    !result ||
    !section
  ) {

    return;

  }


  const prizes =
    Array.isArray(
      names
    )

      ?

      names.filter(
        Boolean
      )

      :

      [];


  if (
    !prizes.length
  ) {


    section.style.display =
      'none';


    jumpBtn
      ?.
      classList
      .add(
        'hidden-section'
      );


    return;

  }


  section.style.display =
    'block';


  jumpBtn
    ?.
    classList
    .remove(
      'hidden-section'
    );


  const ctx =
    canvas.getContext(
      '2d'
    );


  const colors = [

    '#f94144',

    '#f3722c',

    '#f8961e',

    '#43aa8b',

    '#577590',

    '#277da1'

  ];


  const angle =

    2 *

    Math.PI

    /

    prizes.length;


  let rotation =
    0;


  let spinning =
    false;


  function draw(
    rotate = 0
  ) {


    ctx.clearRect(
      0,
      0,
      400,
      400
    );


    ctx.save();


    ctx.translate(
      200,
      200
    );


    ctx.rotate(
      rotate
    );


    ctx.translate(
      -200,
      -200
    );


    prizes.forEach(
      (
        name,
        index
      ) => {


        const start =

          index *

          angle;


        ctx.beginPath();


        ctx.moveTo(
          200,
          200
        );


        ctx.arc(

          200,

          200,

          180,

          start,

          start + angle

        );


        ctx.fillStyle =

          colors[

            index %

            colors.length

          ];


        ctx.fill();


        ctx.stroke();


        ctx.save();


        ctx.translate(
          200,
          200
        );


        ctx.rotate(

          start +

          angle / 2

        );


        ctx.textAlign =
          'right';


        ctx.fillStyle =
          '#fff';


        if (
          prizes.length > 30
        ) {

          ctx.font =
            '10px Arial';

        }

        else if (
          prizes.length > 18
        ) {

          ctx.font =
            '11px Arial';

        }

        else {

          ctx.font =
            '14px Arial';

        }


        const maxChars =

          prizes.length > 30

            ?

            6

            :

            10;


        ctx.fillText(

          name.slice(
            0,
            maxChars
          ),

          160,

          5

        );


        ctx.restore();


      }
    );


    ctx.restore();


  }


  spinBtn.onclick =
    () => {


      if (
        spinning
      ) {

        return;

      }


      spinning =
        true;


      spinBtn.disabled =
        true;


      result.textContent =
        '轉動中...';


      const start =
        rotation;


      const end =

        start

        +

        (
          5 +
          Math.random() *
          3
        )

        *

        2 *

        Math.PI;


      const started =
        performance.now();


      function animate(
        now
      ) {


        const progress =

          Math.min(

            (
              now -
              started
            )

            /

            5000,

            1

          );


        const ease =

          1

          -

          Math.pow(
            1 - progress,
            3
          );


        rotation =

          start

          +

          (
            end -
            start
          )

          *

          ease;


        draw(
          rotation
        );


        if (
          progress < 1
        ) {


          requestAnimationFrame(
            animate
          );


          return;


        }


        const normalized =

          rotation

          %

          (
            2 *
            Math.PI
          );


        const pointer =

          (

            3 *
            Math.PI /
            2

            -

            normalized

            +

            2 *
            Math.PI

          )

          %

          (
            2 *
            Math.PI
          );


        const winner =

          prizes[

            Math.floor(

              pointer /

              angle

            )

            %

            prizes.length

          ];


        const url =

          window
          .placeUrlMap
          ?.
          [
            winner
          ];


        result.textContent =
          '🎉 抽到的是：';


        if (
          url
        ) {


          const link =
            document.createElement(
              'a'
            );


          link.href =
            url;


          link.target =
            '_blank';


          link.rel =
            'noopener noreferrer';


          link.textContent =
            winner;


          result.append(
            link,
            '！'
          );


        }

        else {


          result.append(
            `${winner}！`
          );


        }


        spinning =
          false;


        spinBtn.disabled =
          false;


      }


      requestAnimationFrame(
        animate
      );


    };


  result.textContent =
    '請按下「轉動！」開始遊戲';


  draw();


};

</script>


</body>

</html>
