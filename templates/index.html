<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>吃喝玩樂搜尋器</title>

  <link rel="stylesheet" href="/static/style.css" />
  <link rel="icon" href="/static/favicon.ico" type="image/x-icon" />

  <style>
    html {
      scroll-behavior: smooth;
    }

    * {
      box-sizing: border-box;
    }

    .jump-to-wheel {
      display: inline-block;
      margin-top: 12px;
      margin-bottom: 12px;
      text-decoration: none;
      text-align: center;
    }

    #result a {
      font-weight: bold;
      text-decoration: underline;
    }

    /* =========================
       手機版
       ========================= */
    @media (max-width: 768px) {

      body {
        margin: 0;
        padding: 0;
        overflow-x: hidden;
      }

      .container {
        width: 100% !important;
        max-width: 100% !important;
        margin: 0 auto !important;
        padding: 12px !important;
      }

      h1 {
        font-size: 1.7rem !important;
        line-height: 1.3;
        margin-top: 12px;
      }

      h2 {
        font-size: 1.3rem !important;
        line-height: 1.4;
      }

      h3 {
        font-size: 1.05rem !important;
      }

      h4 {
        font-size: 0.9rem;
        line-height: 1.5;
      }

      section {
        width: 100%;
        max-width: 100%;
        padding: 14px !important;
        margin-bottom: 14px !important;
      }

      .btn,
      .btn-small,
      .jump-to-wheel {
        display: block !important;
        width: 100% !important;
        max-width: 100% !important;
        min-height: 44px;
        margin: 8px 0 !important;
        padding: 11px 12px !important;
        font-size: 1rem !important;
      }

      input[type="text"],
      select {
        display: block;
        width: 100% !important;
        max-width: 100% !important;
        min-height: 44px;
        font-size: 16px !important;
      }

      /*
       * iPhone 若 input 字體低於 16px，
       * Safari 點輸入框可能會自動放大畫面。
       */
      #addressInput {
        font-size: 16px !important;
      }

      .range-container {
        display: flex !important;
        flex-direction: column !important;
        align-items: stretch !important;
        gap: 6px;
        width: 100%;
      }

      #searchRadius {
        width: 100% !important;
      }

      #radiusValue {
        margin-left: 0 !important;
      }

      #placesActions {
        display: grid;
        grid-template-columns: 1fr;
        gap: 6px;
        width: 100%;
      }

      #placesActions.hidden-section {
        display: none !important;
      }

      #placesList {
        display: grid !important;
        grid-template-columns: 1fr !important;
        gap: 12px !important;
        width: 100%;
      }

      .place-item {
        width: 100% !important;
        max-width: 100% !important;
        padding: 12px !important;
        margin: 0 !important;
        overflow: hidden;
      }

      .place-item label {
        display: block;
        width: 100%;
        min-width: 0;
      }

      .place-item h3,
      .place-item p {
        overflow-wrap: anywhere;
        word-break: break-word;
      }

      .place-img {
        display: block;
        width: 100% !important;
        max-width: 100% !important;
        height: auto !important;
        max-height: 240px !important;
        object-fit: cover;
        border-radius: 8px;
        margin-top: 8px;
        margin-bottom: 8px;
      }

      .place-item a {
        overflow-wrap: anywhere;
        word-break: break-word;
      }

      #wheelSection {
        width: 100%;
        max-width: 100%;
        overflow: hidden;
        scroll-margin-top: 12px;
      }

      .wheel-wrapper {
        position: relative;
        width: 100% !important;
        max-width: 360px !important;
        margin: 20px auto !important;
      }

      #wheelCanvas {
        display: block;
        width: 100% !important;
        max-width: 400px !important;
        height: auto !important;
        margin: 0 auto;
      }

      #result {
        width: 100%;
        text-align: center;
        overflow-wrap: anywhere;
        word-break: break-word;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>吃喝玩樂搜尋器</h1>

    <div id="message" class="message"></div>


    <!-- ================================
         定位
         ================================ -->

    <section id="locationSection">

      <h2>我的位置</h2>

      <p id="currentLocationDisplay">
        正在獲取您的位置...
      </p>

      <button
        id="getLocationBtn"
        class="btn"
      >
        重新獲取我的位置
      </button>


      <div
        id="manualLocationInput"
        class="hidden-section"
      >

        <p>
          或輸入您的地址：
        </p>

        <input
          type="text"
          id="addressInput"
          placeholder="例如：台北市信義區市府路1號"
        />

        <button
          id="geocodeAddressBtn"
          class="btn"
        >
          轉換地址
        </button>

      </div>

    </section>


    <!-- ================================
         搜尋設定
         ================================ -->

    <section
      id="placeTypeSelection"
      class="hidden-section"
    >

      <h2>
        搜尋附近地點
      </h2>

      <p>
        請選擇您想搜尋的「吃喝玩樂」類型：
      </p>


      <select id="searchType">

        <optgroup label="🍽️ 吃喝">

          <option value="restaurant">
            餐廳
          </option>

          <option value="cafe">
            咖啡廳
          </option>

          <option value="bar">
            酒吧
          </option>

          <option value="bakery">
            麵包店
          </option>

          <option value="meal_delivery">
            餐點外送
          </option>

          <option value="meal_takeaway">
            餐點外帶
          </option>

        </optgroup>


        <optgroup label="🎡 玩樂">

          <option value="amusement_park">
            遊樂園
          </option>

          <option value="park">
            公園
          </option>

          <option value="museum">
            博物館
          </option>

          <option value="movie_theater">
            電影院
          </option>

          <option value="bowling_alley">
            保齡球館
          </option>

          <option value="shopping_mall">
            購物中心
          </option>

          <option value="spa">
            SPA
          </option>

          <option value="beauty_salon">
            美容院
          </option>

          <option value="gym">
            健身房
          </option>

          <option value="zoo">
            動物園
          </option>

          <option value="tourist_attraction">
            觀光景點
          </option>

          <option value="night_club">
            KTV / 夜店
          </option>

        </optgroup>

      </select>


      <div class="range-container">

        <label for="searchRadius">
          搜尋範圍：
        </label>

        <input
          type="range"
          id="searchRadius"
          min="100"
          max="10000"
          value="5000"
          step="100"
        />

        <span id="radiusValue">
          5000
        </span>

        <span>
          公尺
        </span>

      </div>


      <button
        id="searchNearbyBtn"
        class="btn"
      >
        開始搜尋
      </button>

    </section>


    <!-- ================================
         搜尋結果
         ================================ -->

    <section id="resultsContainer">

      <h2>
        搜尋結果
      </h2>

      <p>
        下方有轉盤抽選功能
      </p>

      <h4>
        若該店無圖片，本頁將以風景照替代
      </h4>


      <div
        id="placesActions"
        class="hidden-section"
      >

        <button
          id="selectAllBtn"
          class="btn-small"
        >
          全選
        </button>


        <button
          id="deselectAllBtn"
          class="btn-small"
        >
          全不選
        </button>


        <button
          id="updateWheelBtn"
          class="btn-small"
        >
          🎯 根據勾選更新轉盤
        </button>

      </div>


      <!--
          新增：
          搜尋有結果後才顯示
      -->

      <a
        id="jumpToWheelBtn"
        href="#wheelSection"
        class="btn jump-to-wheel hidden-section"
      >
        🎡 直接前往轉盤
      </a>


      <div id="placesList"></div>

    </section>


    <!-- ================================
         轉盤
         ================================ -->

    <section
      id="wheelSection"
      style="display:none;"
    >

      <h2>
        🎡 轉盤抽選
      </h2>


      <div class="wheel-wrapper">

        <div class="pointer"></div>

        <canvas
          id="wheelCanvas"
          width="400"
          height="400"
        >
        </canvas>

      </div>


      <button
        id="spinBtn"
        class="btn"
      >
        轉動！
      </button>


      <p id="result">
        請按下「轉動！」開始遊戲
      </p>


      <!--
          方便手機使用者再回搜尋結果
      -->

      <a
        href="#resultsContainer"
        class="btn jump-to-wheel"
      >
        ↑ 回到搜尋結果
      </a>

    </section>

  </div>


  <!-- ================================
       主搜尋程式
       ================================ -->

  <script src="/static/script.js"></script>


  <!-- ================================
       轉盤
       ================================ -->

  <script>

    window.setupWheelWithPlaces = function (placeNames) {

      const canvas =
        document.getElementById('wheelCanvas');

      const spinBtn =
        document.getElementById('spinBtn');

      const result =
        document.getElementById('result');

      const wheelSection =
        document.getElementById('wheelSection');

      const jumpToWheelBtn =
        document.getElementById('jumpToWheelBtn');


      if (
        !canvas ||
        !spinBtn ||
        !result ||
        !wheelSection
      ) {
        return;
      }


      const prizes =
        Array.isArray(placeNames)
          ? placeNames.filter(Boolean)
          : [];


      /*
       * 沒有選擇任何地點：
       * 隱藏轉盤與「直接前往轉盤」
       */

      if (prizes.length === 0) {

        wheelSection.style.display =
          'none';

        if (jumpToWheelBtn) {
          jumpToWheelBtn.classList.add(
            'hidden-section'
          );
        }

        result.textContent =
          '請先勾選至少一個地點';

        return;
      }


      /*
       * 有資料：
       * 顯示轉盤與跳轉按鈕
       */

      wheelSection.style.display =
        'block';

      if (jumpToWheelBtn) {
        jumpToWheelBtn.classList.remove(
          'hidden-section'
        );
      }


      const ctx =
        canvas.getContext('2d');


      const totalSegments =
        prizes.length;


      const baseColors = [
        '#f94144',
        '#f3722c',
        '#f8961e',
        '#43aa8b',
        '#577590',
        '#277da1'
      ];


      const colors =
        Array.from(
          {
            length: totalSegments
          },
          (_, i) =>
            baseColors[
              i % baseColors.length
            ]
        );


      const anglePerSegment =
        (2 * Math.PI) /
        totalSegments;


      let currentAngle = 0;

      let spinning = false;


      function drawWheel(
        rotation = 0
      ) {

        ctx.clearRect(
          0,
          0,
          400,
          400
        );


        ctx.save();

        ctx.translate(
          200,
          200
        );

        ctx.rotate(
          rotation
        );

        ctx.translate(
          -200,
          -200
        );


        for (
          let i = 0;
          i < totalSegments;
          i++
        ) {

          const startAngle =
            i *
            anglePerSegment;


          const endAngle =
            startAngle +
            anglePerSegment;


          ctx.beginPath();

          ctx.moveTo(
            200,
            200
          );

          ctx.arc(
            200,
            200,
            180,
            startAngle,
            endAngle
          );


          ctx.fillStyle =
            colors[i];

          ctx.fill();

          ctx.stroke();


          ctx.save();

          ctx.translate(
            200,
            200
          );


          ctx.rotate(
            startAngle +
            anglePerSegment / 2
          );


          ctx.textAlign =
            'right';


          ctx.fillStyle =
            'white';


          ctx.font =
            '14px Arial';


          ctx.fillText(
            prizes[i].slice(
              0,
              10
            ),
            160,
            10
          );


          ctx.restore();
        }


        ctx.restore();
      }


      function showResult(
        placeName
      ) {

        const placeUrl =
          window.placeUrlMap?.[
            placeName
          ];


        result.textContent =
          '🎉 抽到的是：';


        if (placeUrl) {

          const link =
            document.createElement(
              'a'
            );


          link.href =
            placeUrl;


          link.target =
            '_blank';


          link.rel =
            'noopener noreferrer';


          link.textContent =
            placeName;


          result.appendChild(
            link
          );


          result.append(
            '！'
          );

        } else {

          result.append(
            `${placeName}！`
          );

        }
      }


      function spinWheel() {

        if (
          spinning ||
          prizes.length === 0
        ) {
          return;
        }


        spinning = true;


        result.textContent =
          '轉動中...';


        spinBtn.disabled =
          true;


        const startAngle =
          currentAngle;


        const spinAmount =
          (
            5 +
            Math.random() * 3
          ) *
          2 *
          Math.PI;


        const finalAngle =
          startAngle +
          spinAmount;


        const duration =
          5000;


        const startTime =
          performance.now();


        function animate(time) {

          const elapsed =
            time -
            startTime;


          const progress =
            Math.min(
              elapsed /
              duration,
              1
            );


          const ease =
            1 -
            Math.pow(
              1 - progress,
              3
            );


          currentAngle =
            startAngle +
            (
              finalAngle -
              startAngle
            ) *
            ease;


          drawWheel(
            currentAngle
          );


          if (
            progress < 1
          ) {

            requestAnimationFrame(
              animate
            );

            return;
          }


          const normalized =
            currentAngle %
            (
              2 *
              Math.PI
            );


          const pointerAngle =
            (
              3 *
              Math.PI /
              2 -
              normalized +
              2 *
              Math.PI
            ) %
            (
              2 *
              Math.PI
            );


          const index =
            Math.floor(
              pointerAngle /
              anglePerSegment
            ) %
            totalSegments;


          showResult(
            prizes[index]
          );


          spinning =
            false;


          spinBtn.disabled =
            false;
        }


        requestAnimationFrame(
          animate
        );
      }


      spinBtn.onclick =
        spinWheel;


      result.textContent =
        '請按下「轉動！」開始遊戲';


      drawWheel();
    };

  </script>

</body>
</html>
